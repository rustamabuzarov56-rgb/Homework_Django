{% extends 'blog/base.html' %}
{% block title %}Подтверждение удаления{% endblock %}
{% block content %}
<div class="container mt-4">
    <h1>Удаление статьи</h1>
    <p>Вы уверены, что хотите удалить статью <strong>"{{object.title}}"</strong></p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'blog:post_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
